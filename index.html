<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STVX Portfolio</title>
    <style>
        @font-face {
            font-family: 'Monument Extended';
            src: url('fonts/en/MonumentExtended-Regular.otf') format('opentype');
            font-weight: 400;
            font-style: normal;
        }
        @font-face {
            font-family: 'Monument Extended';
            src: url('fonts/en/MonumentExtended-Ultrabold.otf') format('opentype');
            font-weight: 800;
            font-style: normal;
        }
        @font-face {
            font-family: 'F37 Zagma Arabic';
            src: url('fonts/ar/F37ZagmaArabicTrial-Light.otf') format('opentype');
            font-weight: 300;
            font-style: normal;
        }
        @font-face {
            font-family: 'F37 Zagma Arabic';
            src: url('fonts/ar/F37ZagmaArabicTrial-Regular.otf') format('opentype');
            font-weight: 400;
            font-style: normal;
        }
        @font-face {
            font-family: 'F37 Zagma Arabic';
            src: url('fonts/ar/F37ZagmaArabicTrial-Bold.otf') format('opentype');
            font-weight: 700;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #18181B;
            --secondary: #3F3F46;
            --cta: #2563EB;
            --background: #09090B;
            --text: #FAFAFA;
            --accent: #3B82F6;
        }

        body {
            font-family: 'F37 Zagma Arabic', 'Monument Extended', sans-serif;
            background: var(--background);
            color: var(--text);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Loading Screen */
        .loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--background);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .loader.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .loader-logo img {
            width: 120px;
            animation: pulse 2s ease-in-out infinite;
        }

        .loader-bar {
            width: 200px;
            height: 2px;
            background: var(--secondary);
            margin-top: 2rem;
            border-radius: 2px;
            overflow: hidden;
        }

        .loader-progress {
            width: 0%;
            height: 100%;
            background: var(--cta);
            animation: load 2s ease-in-out forwards;
        }

        @keyframes load {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Navigation */
        .nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 1.5rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            background: linear-gradient(to bottom, rgba(9, 9, 11, 0.9), transparent);
        }

        .logo img {
            height: 70px;
            width: auto;
            display: block;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            color: var(--text);
            text-decoration: none;
            font-family: 'F37 Zagma Arabic', sans-serif;
            font-size: 0.875rem;
            letter-spacing: 0.1em;
            opacity: 0.7;
            transition: opacity 0.3s ease;
        }

        .nav-links a:hover {
            opacity: 1;
        }

        /* Progress Bar */
        .progress-container {
            position: fixed;
            top: 50%;
            right: 2rem;
            transform: translateY(-50%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .progress-line {
            width: 2px;
            height: 100px;
            background: var(--secondary);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            width: 100%;
            height: 0%;
            background: var(--cta);
            transition: height 0.3s ease;
        }

        .progress-text {
            font-family: 'Monument Extended', sans-serif;
            font-size: 0.75rem;
            color: var(--text);
            opacity: 0.5;
        }

        /* Hero - 01.png at native resolution, no crop, no resample */
        .hero {
            width: 100%;
            position: relative;
            background: var(--background);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .hero img {
            width: 100%;
            height: auto;
            display: block;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }

        .scroll-indicator {
            position: absolute;
            bottom: 3rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            animation: bounce 2s ease-in-out infinite;
            z-index: 10;
        }

        .scroll-indicator span {
            font-family: 'Monument Extended', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 0.2em;
            opacity: 0.5;
            color: var(--text);
        }

        .scroll-line {
            width: 1px;
            height: 60px;
            background: linear-gradient(to bottom, var(--text), transparent);
        }

        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(10px); }
        }

        /* Presentation - Full width images, no frames, no resample */
        .presentation {
            position: relative;
        }

        .slide {
            width: 100%;
            position: relative;
            overflow: hidden;
            scroll-snap-align: start;
        }

        .slide img {
            width: 100%;
            height: auto;
            display: block;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }

        /* Fade in animation - only opacity, no transform to avoid resample */
        .slide-content {
            opacity: 0;
            transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .slide-content.visible {
            opacity: 1;
        }

        /* Controls */
        .controls {
            position: fixed;
            bottom: 3rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 1rem;
            z-index: 1000;
        }

        .control-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 1px solid var(--secondary);
            background: rgba(9, 9, 11, 0.8);
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .control-btn:hover {
            background: var(--cta);
            border-color: var(--cta);
            transform: scale(1.1);
        }

        .control-btn.active {
            background: var(--cta);
            border-color: var(--cta);
        }

        /* Footer */
        .footer {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 4rem 2rem;
            position: relative;
        }

        .footer-title {
            font-family: 'F37 Zagma Arabic', sans-serif;
            font-size: clamp(2rem, 6vw, 5rem);
            font-weight: 700;
            margin-bottom: 2rem;
            background: linear-gradient(135deg, var(--text), var(--cta));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .footer-links {
            display: flex;
            gap: 3rem;
            margin-top: 3rem;
        }

        .footer-links a {
            color: var(--text);
            text-decoration: none;
            font-family: 'Monument Extended', sans-serif;
            font-size: 1rem;
            opacity: 0.6;
            transition: all 0.3s ease;
            position: relative;
        }

        .footer-links a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--cta);
            transition: width 0.3s ease;
        }

        .footer-links a:hover {
            opacity: 1;
        }

        .footer-links a:hover::after {
            width: 100%;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .nav {
                padding: 1rem 1.5rem;
            }

            .logo img {
                height: 50px;
            }

            .nav-links {
                display: none;
            }

            .progress-container {
                right: 1rem;
            }

            .controls {
                bottom: 1.5rem;
            }

            .control-btn {
                width: 40px;
                height: 40px;
            }
        }

        html {
            scroll-behavior: smooth;
        }

        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: var(--background);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--cta);
            border-radius: 2px;
        }
    </style>

    <script>
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('loader').classList.add('hidden');
            }, 2500);
        });

        const slides = document.querySelectorAll('.slide');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        let currentSlide = 1;
        let isPlaying = false;
        let playInterval;
        let scrollTimeout;

        const slideObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.querySelector('.slide-content').classList.add('visible');
                    const slideNum = parseInt(entry.target.dataset.slide);
                    currentSlide = slideNum;
                    updateProgress(slideNum);
                }
            });
        }, { threshold: 0.5 });

        slides.forEach(slide => slideObserver.observe(slide));

        function updateProgress(num) {
            const percent = (num / 38) * 100;
            progressFill.style.height = percent + '%';
            progressText.textContent = String(num).padStart(2, '0') + '/38';
        }

        function smoothScrollTo(element, duration) {
            const targetY = element.getBoundingClientRect().top + window.pageYOffset;
            const startY = window.pageYOffset;
            const distance = targetY - startY;
            const startTime = performance.now();

            function easeInOutCubic(t) {
                return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
            }

            function step(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const eased = easeInOutCubic(progress);
                window.scrollTo(0, startY + distance * eased);
                if (progress < 1) {
                    requestAnimationFrame(step);
                }
            }

            requestAnimationFrame(step);
        }

        function scrollToSlide(num) {
            let target;
            if (num === 0) {
                smoothScrollTo(document.querySelector('.hero'), 1200);
                return;
            }
            target = document.querySelector(`[data-slide="${num}"]`);
            if (target) smoothScrollTo(target, 1200);
        }

        document.getElementById('prevBtn').addEventListener('click', () => {
            if (currentSlide > 2) scrollToSlide(currentSlide - 1);
            else scrollToSlide(0);
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            if (currentSlide < 38) scrollToSlide(currentSlide + 1);
        });

        document.getElementById('playBtn').addEventListener('click', function() {
            isPlaying = !isPlaying;
            this.classList.toggle('active');
            if (isPlaying) {
                this.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>';
                playInterval = setInterval(() => {
                    if (currentSlide < 38) scrollToSlide(currentSlide + 1);
                    else scrollToSlide(2);
                }, 4000);
            } else {
                this.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>';
                clearInterval(playInterval);
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
                e.preventDefault();
                if (currentSlide < 38) scrollToSlide(currentSlide + 1);
            } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
                e.preventDefault();
                if (currentSlide > 2) scrollToSlide(currentSlide - 1);
                else scrollToSlide(0);
            } else if (e.key === ' ') {
                e.preventDefault();
                document.getElementById('playBtn').click();
            }
        });
    </script>
